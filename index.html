function getVoices(){if(!('speechSynthesis' in window))return [];try{return window.speechSynthesis.getVoices().filter(v=>/^en-GB$/i.test(v.lang.replace('_','-')))}catch(e){return []}}
function britishVoice(){const list=getVoices();return list.find(v=>/male|daniel|george|ryan|oliver|arthur|alfie|thomas|uk english male/i.test(v.name)&&!/female/i.test(v.name))||list.find(v=>/google uk english male/i.test(v.name))||list[0]||null}
function loadVoices(){voices=getVoices();const el=$('#voiceAvailability');if(el)el.textContent=britishVoice()?'النطق: الإنجليزية البريطانية (صوت ذكوري عند توفره)':'النطق: الإنجليزية البريطانية مطلوبة؛ قد يستخدم الجهاز صوتًا بديلًا';}

function speak(text,slow=false){let status=$('#audioStatus');if(!('speechSynthesis'in window)){if(status)status.textContent='متصفحك لا يدعم النطق الآلي. جرّب Chrome أو Edge.';return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=britishVoice();u.lang='en-GB';if(v)u.voice=v;u.rate=slow?.72:.91;u.pitch=1;u.onstart=()=>{if(status)status.textContent='يُشغَّل الآن: '+text};u.onend=()=>{if(status)status.textContent='اكتمل الاستماع. يمكنك الإعادة.'};u.onerror=e=>{if(status)status.textContent='تعذر تشغيل الصوت ('+e.error+'). تأكد من توفر صوت بريطاني على جهازك.'};window.speechSynthesis.speak(u);if(status)status.textContent='جارٍ تجهيز الصوت…'}catch(e){if(status)status.textContent='خطأ في تشغيل الصوت: '+e.message}}

function render(){const root=$('#root');$('#homeButton').classList.toggle('hidden',!profile);if(!profile){root.innerHTML=`<div class="onboard"><section class="hero"><div class="eyebrow">TECHNICAL & VOCATIONAL TRAINING CORPORATION</div><h1>رحلة إتقان<br>الأصوات الإنجليزية</h1><p>من سماع الصوت الأول إلى قراءة الكلمات والجمل بثقة، خطوة بخطوة.</p><div class="herochips"><span>44 صوتًا</span><span>تعلّم متدرّج</span><span>تقييم قبل الانتقال</span><span>نطق وقراءة وكتابة</span></div></section><section class="enroll"><div class="sectiontag">WELCOME TO YOUR LEARNING JOURNEY</div><h2>ابدأ رحلتك التعليمية</h2><p>اكتب بياناتك لبدء برنامج التأسيس الصوتي. سيتم حفظ تقدمك على هذا الجهاز.</p><label class="fieldlabel" for="studentName">اسم المتدرب</label><input class="field" id="studentName" placeholder="الاسم الثلاثي" autocomplete="name"><label class="fieldlabel" for="studentGroup">المجموعة التدريبية</label><input class="field" id="studentGroup" placeholder="مثال: المجموعة الأولى"><div id="entryError" class="error" aria-live="polite"></div><button class="btn" onclick="saveProfile()">ابدأ التعلم ←</button><p class="small muted" style="margin-top:23px">English 1 · General Studies Department<br>Trainer: ADEL ALSMAEEL</p></section></div>`;return}
if(idx<0){let next=Number.isInteger(lastLesson)&&lastLesson>=0&&lastLesson<44?lastLesson:Math.min(done(),43);root.innerHTML=shell(`<div class="welcomeDashboard"><div class="sectiontag">WELCOME BACK</div><h1>مرحبًا، ${escapeHTML(profile.name)}</h1><div class="muted">المجموعة: ${escapeHTML(profile.group)} · رحلة الأصوات الإنجليزية</div></div><div class="milestones"><div class="milestone"><strong>${done()}/44</strong><span>أصوات متقنة</span></div><div class="milestone"><strong>7</strong><span>مراحل لكل صوت</span></div><div class="milestone"><strong>80%</strong><span>حد اجتياز التقييم</span></div></div><div class="info"><h3>كيف تبدأ؟</h3><p>ابدأ بالصوت الأول، واستمع وتعرّف إلى الكلمات ثم أكمل الأنشطة المتنوعة. يمكنك فتح أي صوت في أي وقت، ويُحفظ آخر درس فتحته على هذا الجهاز.</p></div><div class="actions"><button class="btn" onclick="openLesson(${next})">${done()?'متابعة التعلم':'ابدأ الصوت الأول'} ←</button><button class="btn ghost" onclick="changeProfile()">تغيير بيانات المتدرب</button></div>`);return}
const d=DATA[idx];let content=`<div class="breadcrumb">الأصوات الإنجليزية / الصوت ${idx+1} من 44</div><div class="heading"><div><div class="sectiontag">PHONICS LEARNING JOURNEY</div><h1>${STAGES[stage]}</h1><div class="muted">الصوت ${escapeHTML(d.ipa)} · كتابة الصوت: <b class="en">${escapeHTML(d.spell)}</b></div></div><div class="stepcount">المرحلة ${stage+1} / 7</div></div><div class="stagebar">${STAGES.map((_,i)=>`<span class="${i===stage?'active':i<stage?'done':''}"></span>`).join('')}</div>`;
if(stage===0)content+=discovery(d);else content+=activities(d);
root.innerHTML=shell(content);loadVoices()}
function patternList(d){return [...new Set(d.words.map(w=>w.pattern||d.spell))]}
function hasPatterns(d){return patternList(d).length>1}
function currentWords(d){return activePattern==='all'?d.words:d.words.filter(w=>(w.pattern||d.spell)===activePattern)}
function setPattern(p){activePattern=p;attempt=0;graded=false;score=0;answers={};qs=[];render()}
function patternTabs(d){if(!hasPatterns(d))return '';const pats=patternList(d);return `<section class="patternlesson"><div class="sectiontag">SOUND → SPELLING · تعلم كل شكل كتابي على حدة</div><h3>الصوت ${escapeHTML(d.ipa)} له ${pats.length} أشكال كتابية في مفردات الدرس</h3><p>الصوت واحد، لكن طريقة كتابته تختلف. اختر شكلًا واحدًا، وتدرّب على كلماته أولًا، ثم انتقل إلى الشكل التالي. في الاختبار النهائي تُراجع جميع الأشكال معًا.</p><div class="patterntabs">${pats.map((p,i)=>`<button class="patterntab ${activePattern===p?'active':''}" onclick='setPattern(${JSON.stringify(p)})'><b class="en">${escapeHTML(p)}</b><small>${d.words.filter(w=>w.pattern===p).length} كلمات</small></button>`).join('')}<button class="patterntab ${activePattern==='all'?'active':''}" onclick="setPattern('all')"><b>مراجعة شاملة</b><small>كل الأشكال</small></button></div>${d.patternNote?`<div class="patternnote">${escapeHTML(d.patternNote)}</div>`:''}<div class="patternexamples">${pats.map(p=>`<div><strong class="en">${escapeHTML(p)}</strong> ${d.words.filter(w=>w.pattern===p).map(w=>`<span class="en">${escapeHTML(w.w)}</span>`).join(' ')}</div>`).join('')}</div></section>`}
function focusLabel(d){return activePattern==='all'?'جميع الأشكال':`الشكل الكتابي: ${activePattern}`}
function discovery(d){const first=d.words[0];return `<div class="lessonhero"><div><div class="sectiontag">ONE SOUND AT A TIME</div><div class="letterforms en" aria-label="شكل الحرف الكبير والصغير">${escapeHTML(d.spell.split(/[ /]/)[0].toUpperCase())} <span>${escapeHTML(d.spell.split(/[ /]/)[0].toLowerCase())}</span></div><div class="soundlabel">الصوت: <b class="en">${escapeHTML(d.ipa)}</b></div><h2>تعرف إلى هذا الصوت فقط</h2><p>شاهد الكلمة المفتاحية واستمع إلى نطقها. لا تحفظ اسم الحرف بدل صوته.</p><div class="miniwords"><span class="en">${escapeHTML(d.spell)}</span><span>${escapeHTML(d.cat)}</span></div></div><button class="roundsound" onclick='speak(${JSON.stringify(first.w)})' aria-label="استمع إلى الكلمة المفتاحية">▶</button></div>${audioControls()}${patternTabs(d)}<div class="info"><h3>طريقة التعلم</h3><p>١. استمع إلى الكلمة. ٢. لاحظ الصوت المستهدف. ٣. كرر النطق. ٤. اربط الكلمة بمعناها وصورتها. الكلمات مصحوبة بمعانيها. بعض الأصوات تختلف باختلاف اللهجة، ويُستحسن أن يتحقق المدرب من نطقها.</p></div><div class="wordgrid">${currentWords(d).map(w=>wordCard(w)).join('')}</div><div class="actions"><button class="btn" onclick="setStage(1)">تدرب على التمييز السمعي ←</button><button class="btn alt" onclick="speak(${JSON.stringify(first.w)},true)">🔊 استمع ببطء</button></div>`}
function highlightWord(w){if(!w.pattern||w.pattern==='other')return escapeHTML(w.w);let pat=w.pattern.toLowerCase(),word=w.w,at=-1,len=pat.length;if(pat.includes('_')){const bits=pat.split('_');const re=new RegExp(bits[0]+'(.)'+bits[1],'i');const m=word.match(re);if(m){at=m.index;len=m[0].length}}else at=word.toLowerCase().indexOf(pat);if(at<0)return escapeHTML(word);return escapeHTML(word.slice(0,at))+'<mark class="grapheme">'+escapeHTML(word.slice(at,at+len))+'</mark>'+escapeHTML(word.slice(at+len))}
function wordCard(w){return `<div class="wordcard"><div class="visual" role="img" aria-label="${escapeHTML(w.ar)}">${escapeHTML(w.emoji)}</div><strong class="en">${highlightWord(w)}</strong><small>${escapeHTML(w.ar)}</small><button onclick='speak(${JSON.stringify(w.w)})'>🔊 استمع</button></div>`}
function norm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function mix(a,seed){let b=a.slice();let n=(seed+1)*2654435761>>>0;for(let i=b.length-1;i>0;i--){n=(Math.imul(n,1664525)+1013904223)>>>0;let j=n%(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
const allWords=()=>DATA.flatMap(d=>d.words);
function uniquePairs(words,limit){const seenWords=new Set(),seenMeanings=new Set();return words.filter(x=>{const word=norm(x.w),meaning=norm(x.ar);if(seenWords.has(word)||seenMeanings.has(meaning))return false;seenWords.add(word);seenMeanings.add(meaning);return true}).slice(0,limit)}
function spellingLocations(d){const spellings=d.spell.split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);return currentWords(d).map(x=>{const word=x.w.toLowerCase();const hits=(x.pattern?[x.pattern]:spellings).filter(sp=>sp!=='other').flatMap(sp=>{if(sp.includes('_')){const r=new RegExp('^'+sp.replace('_','.')+'$');return r.test(word)?[{sp,at:0}]:[]}const at=word.indexOf(sp);return at<0?[]:[{sp,at}]}).filter(Boolean);if(!hits.length)return null;const h=hits[0];return {word:x.w,sp:h.sp,where:h.at===0?'بداية الكلمة':h.at+h.sp.length===word.length?'نهاية الكلمة':'وسط الكلمة'}}).filter(Boolean)}

function makeQuestions(d,st){const w=st===6?d.words:currentWords(d),seed=idx*97+attempt*41+st*23,other=allWords().filter(z=>!w.some(y=>y.w===z.w)),pick=(arr,n)=>mix(arr,seed+n),q=[];function add(type,prompt,key,opts=[],audio='',note=''){q.push({type,prompt,key,opts:mix([...new Set([key,...opts])],seed+q.length),audio,note})}
if(st===1){w.forEach((x,i)=>{let wrong=pick(other.filter(y=>y.w.length<=7),i).slice(0,3).map(y=>y.w);add('choice','استمع واختر الكلمة التي سمعتها',x.w,wrong,x.w,'ميّز الكلمة المسموعة دون الاعتماد على المعنى.')});add('choice','استمع ثم اختر الكلمة الصحيحة',w[Math.min(1,w.length-1)].w,pick(other,7).slice(0,3).map(z=>z.w),w[Math.min(1,w.length-1)].w)}
if(st===2){const pairs=uniquePairs(pick(w,4),8);q.push({type:'match',prompt:'اربط كل كلمة بمعناها: اختر الكلمة من العمود الأيمن ثم معناها من العمود الأيسر.',pairs:pairs.map(z=>({w:z.w,ar:z.ar})),opts:mix(pairs.map(z=>z.ar),seed+4),key:pairs.map(z=>z.ar).join('||'),audio:'',note:'صل الكلمات الثماني بمعانيها في سؤال واحد.'});w.slice(0,4).forEach((x,i)=>add('choice',`اختر الكلمة المناسبة للصورة والمعنى: ${x.emoji} ${x.ar}`,x.w,pick(other,i).slice(0,3).map(y=>y.w)))}
if(st===3){if(activePattern.includes('_')){w.forEach((x,i)=>add('choice',`في كلمة ${x.w}، ما شكل كتابة الصوت ${d.ipa}؟`,activePattern,patternList(d).filter(p=>p!==activePattern),x.w,'الحرفان منفصلان وبينهما حرف آخر.'));return q}if(activePattern==='other'){w.forEach(x=>add('choice',`اختر الكلمة التي سمعتها`,x.w,pick(other,2).slice(0,3).map(y=>y.w),x.w));return q}const locations=spellingLocations(d);const groups=['بداية الكلمة','وسط الكلمة','نهاية الكلمة'];const available=groups.filter(pos=>locations.some(x=>x.where===pos));available.forEach((pos,i)=>{const example=pick(locations.filter(x=>x.where===pos),i)[0];add('choice',`استمع إلى ${example.word}: أين يقع الحرف أو الحروف (${example.sp}) في الكلمة المكتوبة؟`,pos,groups.filter(x=>x!==pos),example.word,'نحدد مكان كتابة الصوت في الكلمة، وليس موضع النطق داخل الفم.')});const remaining=pick(locations,17).filter(x=>!available.some(pos=>locations.find(y=>y.where===pos)?.word===x.word)).slice(0,3);remaining.forEach((x,i)=>add('choice',`حدد موضع (${x.sp}) في الكلمة ${x.word}`,x.where,groups.filter(z=>z!==x.where),x.word));add('choice','استمع وحدد كلمة من كلمات هذا الدرس',w[0].w,pick(other,3).slice(0,3).map(z=>z.w),w[0].w)}
if(st===4){w.forEach((x,i)=>{const pos=(i+attempt)%x.w.length;const blank=x.w.slice(0,pos)+'□'+x.w.slice(pos+1);add('text',`أكمل الحرف الناقص: ${blank} (${x.ar})`,x.w[pos],[],x.w,'اكتب الحرف الناقص فقط.')} );w.slice(0,3).forEach(x=>add('text',`استمع واكتب الكلمة كاملة (${x.ar})`,x.w,[],x.w))}
if(st===5){const ss=sentencesFor(d),pool=DATA.flatMap(x=>x.sentences||[]).filter(x=>!ss.some(y=>y.en===x.en));ss.forEach((x,i)=>{add('choice','استمع إلى الجملة واختر الجملة التي سمعتها.',x.en,pick(pool,i).slice(0,3).map(y=>y.en),x.en);add('choice',`اقرأ الجملة واختر معناها: ${x.en}`,x.ar,pick(pool,i+11).slice(0,3).map(y=>y.ar));const words=x.en.replace(/[.!?]/g,'').split(/\s+/);if(words.length>2){const scrambled=mix(words,i+seed+9);const variants=[scrambled.slice().reverse().join(' '),words.slice(1).concat(words[0]).join(' '),words.slice().reverse().join(' ')].filter(y=>y.toLowerCase()!==words.join(' ').toLowerCase());add('choice',`رتّب الكلمات لتكوين جملة صحيحة: ${scrambled.join(' / ')}`,words.join(' '),variants)}})}
if(st===6){const ss=sentencesFor(d),pool=DATA.flatMap(x=>x.sentences||[]).filter(x=>!ss.some(y=>y.en===x.en));const chosen=pick(w,2);add('choice','استمع ثم اختر الكلمة الصحيحة',chosen[0].w,pick(other,1).slice(0,3).map(z=>z.w),chosen[0].w);add('choice',`اختر معنى الكلمة ${chosen[1].w}`,chosen[1].ar,pick(other,2).slice(0,3).map(z=>z.ar));add('choice',`أي كلمة تعني ${chosen[2].ar}؟`,chosen[2].w,pick(other,3).slice(0,3).map(z=>z.w));add('text',`أكمل الحرف الناقص: ${chosen[3].w[0]}□${chosen[3].w.slice(2)} (${chosen[3].ar})`,chosen[3].w[1],[],chosen[3].w);add('text',`استمع ثم اكتب الكلمة كاملة (${chosen[4].ar})`,chosen[4].w,[],chosen[4].w);add('choice','استمع إلى الجملة واختر الجملة الصحيحة',ss[0].en,pick(pool,5).slice(0,3).map(z=>z.en),ss[0].en);add('choice',`اقرأ الجملة ثم اختر معناها: ${ss[1].en}`,ss[1].ar,pick(pool,6).slice(0,3).map(z=>z.ar));{const pairs=uniquePairs(pick(w,8),6);q.push({type:'match',prompt:'اربط الكلمات الست بمعانيها — سؤال واحد من عمودين',pairs:pairs.map(z=>({w:z.w,ar:z.ar})),opts:mix(pairs.map(z=>z.ar),seed+88),key:pairs.map(z=>z.ar).join('||'),audio:'',note:'اختر الكلمة ثم المعنى المقابل.'})}add('choice',`اختر الكلمة المطابقة للمعنى والصورة: ${chosen[5].emoji} ${chosen[5].ar}`,chosen[5].w,pick(other,7).slice(0,3).map(z=>z.w));add('choice','استمع واختر الجملة المسموعة',ss[1].en,pick(pool,8).slice(0,3).map(z=>z.en),ss[1].en);add('text',`اكتب الكلمة الإنجليزية التي تعني: ${chosen[6].ar}`,chosen[6].w);}

return q}
function sentencesFor(d){if(stage===6||activePattern==='all')return d.sentences;const words=currentWords(d).map(w=>w.w.toLowerCase());const matches=d.sentences.filter(s=>words.some(w=>new RegExp('\\b'+w+'\\b','i').test(s.en)));return matches.length?matches:d.sentences}
function activities(d){if(!qs.length)qs=makeQuestions(d,stage);const intro={1:'استمع أولًا ثم اختر. لا تظهر الإجابات قبل إنهاء المحاولة.',2:'تذكر المفردات باستخدام المعنى والصورة والنطق.',3:'لاحظ مكان كتابة الصوت داخل الكلمة. تختلف المواضع بحسب أمثلة الصوت؛ لا نفترض وجوده في البداية والوسط والنهاية دائمًا.',4:'تدرب على التهجئة وكتابة الكلمات من الاستماع.',5:'اقرأ جملًا قصيرة، واستمع إليها، ثم أجب. الجمل طبيعية وذات معنى، وقد تتضمن كلمات تحتاج إلى قراءة مساعدة من المدرب في الدروس الأولى.',6:'تقييم متنوع: استماع للكلمة والجملة، وربط الكلمات بمعانيها، وتهجئة وإملاء وفهم المقروء.'};return `${audioControls()}${stage===6?`<div class="info"><strong>التقييم الشامل:</strong> يغطي جميع الأشكال الكتابية للصوت، وليس شكلًا واحدًا فقط.</div>`:patternTabs(d)}<div class="info"><h3>${STAGES[stage]}</h3><p>${intro[stage]} يجب الحصول على 80% للانتقال، ويمكن إعادة المحاولة بأسئلة متغيرة جزئيًا.</p></div>${stage===2?`<div class="wordgrid">${currentWords(d).map(wordCard).join('')}</div>`:''}<div class="quizhead"><h3>أنشطة المهارة</h3><span class="pill">${qs.length} أسئلة</span></div><div id="questions">${qs.map(questionHTML).join('')}</div><div id="result">${graded?resultHTML():''}</div><div class="actions"><button class="btn alt" onclick="setStage(${stage-1})">المرحلة السابقة</button><div><button class="btn soft" onclick="retry()">↻ تدريب جديد</button> <button class="btn blue" id="gradeButton" onclick="grade()" ${graded?'disabled':''}>صحّح إجاباتي</button> <button class="btn" id="nextButton" onclick="advance()" ${!graded||score/qs.length<.8?'disabled':''}>${stage===6?'اعتماد إتقان الصوت':'المرحلة التالية ←'}</button></div></div>`}
function questionHTML(q,i){let value=answers[i]??'',correct=norm(value)===norm(q.key);return `<div class="question"><div class="questiontop"><span class="qnumber">السؤال ${i+1}</span>${q.audio?`<div><button class="speaker" onclick='speak(${JSON.stringify(q.audio)})'>🔊 استمع</button> <button class="speaker" onclick='speak(${JSON.stringify(q.audio)},true)'>ببطء</button></div>`:''}</div><h4>${escapeHTML(q.prompt)}</h4>${q.type==='match'?`<div class="matchhelp">① اختر كلمة من العمود الأيمن  ② ثم اضغط على معناها في العمود الأيسر. يمكنك تغيير الاختيار قبل التصحيح.</div><div class="matchcolumns"><div class="matchcol"><div class="matchtitle">الكلمات الإنجليزية</div>${q.pairs.map((p,j)=>`<button class="matchtile en ${selectedMatch[i]===j?'focused':''} ${String(value).split('||')[j]?'paired':''}" ${graded?'disabled':''} onclick="selectMatch(${i},${j})">${escapeHTML(p.w)} <span class="matchnumber">${j+1}</span></button>`).join('')}</div><div class="matchcol"><div class="matchtitle">المعاني العربية</div>${q.opts.map(o=>{const pairIndex=String(value).split('||').findIndex(x=>x===o);return `<button class="matchtile ${pairIndex>=0?'paired':''}" ${graded?'disabled':''} onclick='chooseMeaning(${i},${JSON.stringify(o)})'>${escapeHTML(o)} ${pairIndex>=0?`<span class="matchnumber">${pairIndex+1} ✓</span>`:''}</button>`}).join('')}</div></div><div class="small muted">${String(value).split('||').filter(Boolean).length} من ${q.pairs.length} ارتباطات مكتملة</div>`:q.type==='choice'?`<div class="options">${q.opts.map(opt=>`<button class="option ${value===opt?'selected':''} ${graded&&opt===q.key?'correct':''} ${graded&&value===opt&&!correct?'wrong':''}" ${graded?'disabled':''} onclick='answer(${i},${JSON.stringify(opt)})'>${escapeHTML(opt)}</button>`).join('')}</div>`:`<input class="field qinput en" dir="ltr" autocomplete="off" spellcheck="false" placeholder="Type your answer" value="${escapeHTML(value)}" ${graded?'disabled':''} oninput="answer(${i},this.value)">`}${graded?`<div class="feedback ${correct?'':'bad'}">${correct?'✓ إجابة صحيحة':q.type==='match'?'راجع الربط بين الكلمات والمعاني، ثم أعد المحاولة.':'الإجابة الصحيحة: '+escapeHTML(q.key)} ${q.note?'— '+escapeHTML(q.note):''}</div>`:''}</div>`}
function answer(i,v){if(graded)return;answers[i]=v;if(qs[i].type==='choice')$('#questions').innerHTML=qs.map(questionHTML).join('')}
const selectedMatch={};
function selectMatch(i,j){if(graded)return;selectedMatch[i]=j;$('#questions').innerHTML=qs.map(questionHTML).join('')}
function chooseMeaning(i,v){if(graded)return;const j=selectedMatch[i];if(j===undefined)return;let a=(answers[i]||'').split('||');a=a.map((x,k)=>k!==j&&x===v?'':x);a[j]=v;answers[i]=a.join('||');selectedMatch[i]=undefined;$('#questions').innerHTML=qs.map(questionHTML).join('')}
function grade(){if(graded)return;graded=true;score=qs.filter((q,i)=>norm(answers[i])===norm(q.key)).length;$('#questions').innerHTML=qs.map(questionHTML).join('');$('#result').innerHTML=resultHTML();$('#gradeButton').disabled=true;$('#nextButton').disabled=score/qs.length<.8;$('#result').scrollIntoView({behavior:'smooth',block:'center'})}
function resultHTML(){const pass=score/qs.length>=.8;return `<div class="result ${pass?'':'fail'}"><strong>${pass?'أحسنت! اجتزت هذه المرحلة':'لم تكتمل المهارة بعد'}</strong><p>نتيجتك ${score} من ${qs.length} (${Math.round(score/qs.length*100)}%). ${pass?'يمكنك الانتقال الآن.':'راجع أخطاءك وأعد التدريب. لن تنتقل حتى تصل إلى 80%.'}</p></div>`}
function retry(){attempt++;graded=false;score=0;answers={};qs=[];render()}
function advance(){if(!graded||score/qs.length<.8)return;if(stage<6){setStage(stage+1)}else{progress[idx]=true;persist();if(idx<43)openLesson(idx+1);else showHome()}}
render();</script></body></html>
